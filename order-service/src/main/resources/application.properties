# Aplicacion y puerto
spring.application.name=order-service
server.port=8083

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fastfood_order_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Registro de servicios en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Fechas persistidas en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Diagnostico: solo administrador activo confirmado en Auth
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Rechazar campos que no pertenecen a los DTO
spring.jackson.deserialization.fail-on-unknown-properties=true

# JWT de usuario e identidad de los servicios
fastfood.jwt.secret=${JWT_SECRET}
fastfood.internal.secret=${INTERNAL_SECRET}

# Configuracion de pagos con Yape
fastfood.pagos.yape.qr-url=/assets/yape-qr.svg
fastfood.pagos.yape.nombre-comercio=FastFood
fastfood.pagos.yape.instrucciones=Ingresa la referencia de la operacion para que el personal valide el pago.

# Clientes por Eureka, sin reintentos automaticos
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Circuit Breaker: solo la consulta a Catalogo
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=false
spring.cloud.openfeign.circuitbreaker.group.enabled=false
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
resilience4j.circuitbreaker.instances.catalog-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.catalog-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.catalog-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.catalog-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalog-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.catalog-service.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.catalog-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.catalog-service.ignoreExceptions=com.fastfood.order.exception.RemoteBusinessException

# Servicio SOAP de comprobantes
fastfood.soap.url=http://localhost:8084/ws

# Archivos temporales de las descargas administrativas
fastfood.report.directorio=./archivos/reportes
