# Aplicacion y puerto
spring.application.name=socket-server
server.port=8085

# Registro de servicios en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Diagnostico protegido
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Rechazar campos que no pertenecen a los DTO
spring.jackson.deserialization.fail-on-unknown-properties=true

# Listener WebSocket y navegador permitido
fastfood.socket.port=8887
fastfood.cors.allowed-origin=http://localhost:5173

# JWT del participante y credenciales entre servicios
fastfood.jwt.secret=${JWT_SECRET}
fastfood.internal.secret=${INTERNAL_SECRET}

# Clientes por Eureka, sin reintentos automaticos
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000
