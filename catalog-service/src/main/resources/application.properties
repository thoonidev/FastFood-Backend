# Aplicacion y puerto
spring.application.name=catalog-service
server.port=8082

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fastfood_catalog_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Registro de servicios en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Fechas persistidas en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Diagnostico: solo administrador activo confirmado en Auth
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Rechazar campos que no pertenecen a los DTO
spring.jackson.deserialization.fail-on-unknown-properties=true

# JWT de usuario e identidad de los servicios
fastfood.jwt.secret=${JWT_SECRET}
fastfood.internal.secret=${INTERNAL_SECRET}

# Consulta de usuarios por discovery, con tiempos de espera limitados
spring.cloud.openfeign.client.config.auth-service.connectTimeout=2000
spring.cloud.openfeign.client.config.auth-service.readTimeout=3000
